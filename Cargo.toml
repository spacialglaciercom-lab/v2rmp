[package]
name = "v2rmp"
version = "0.1.1"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A powerful Terminal User Interface (TUI) for route optimization using the Chinese Postman Problem algorithm"
documentation = "https://docs.rs/v2rmp"
homepage = "https://github.com/yourusername/v2rmp"
repository = "https://github.com/yourusername/v2rmp"
license = "MIT OR Apache-2.0"
keywords = ["route", "optimization", "tui", "cpp", "graph"]
categories = ["command-line-utilities", "algorithms", "visualization"]
readme = "README.md"
exclude = [
    "target/",
    ".git/",
    ".github/",
    "*.rmp",
    "*.geojson",
    "route_*.json",
    "extract_*.geojson",
]

[[bin]]
name = "rmpca"
path = "src/main.rs"

[[bin]]
name = "rmpca-extract"
path = "src/bin/extract.rs"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"
arboard = "3.4"

# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }

# Extraction - Overture Maps (object_store + parquet + geo)
object_store = { version = "0.11", features = ["aws"] }
parquet = { version = "54", features = ["async"] }
arrow = "54"
futures-util = "0.3"
geo-types = "0.7"
geo-traits = "0.2"
geojson = "0.24"
wkb = "0.8"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
crc32fast = "1.4"

# Extraction - OpenStreetMap PBF
osmpbf = "0.3"

[dev-dependencies]
# Add test dependencies here when tests are implemented

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
