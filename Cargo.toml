[package]
name = "v2rmp"
version = "0.4.0"
edition = "2021"
description = "rmpca — Route Optimization TUI & Agent Engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/spacialglaciercom-lab/v2rmp"
homepage = "https://github.com/spacialglaciercom-lab/v2rmp"
readme = "README.md"
keywords = ["vrp", "route-optimization", "tui", "agent", "osm"]
categories = ["command-line-utilities", "algorithms", "visualization"]
exclude = [
    "monaco.osm.pbf",
    "target/",
    ".bob/",
    "vector_clean.py",
    "*_patch.diff",
]

[[bin]]
name = "rmpca"
path = "src/main.rs"

[[bin]]
name = "rmpca-extract"
path = "src/bin/extract.rs"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
anyhow = "1"
async-trait = "0.1"
lazy_static = "1.4"
reqwest = { version = "0.12", features = ["json"] }
osmpbf = "0.3"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
shellexpand = "3.1"

# Extraction (object_store + parquet + geo)
object_store = { version = "0.11", features = ["aws"] }
parquet = { version = "54", features = ["async"] }
arrow = "54"
futures-util = "0.3"
geo-types = "0.7"
geo-traits = "0.2"
geo = "0.28"
geojson = "0.24"
wkb = "0.8"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
crc32fast = "1.4"
petgraph = "0.6"
rstar = "0.12"
ordered-float = "4.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
