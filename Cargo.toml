[package]
name = "v2rmp"
version = "0.4.6"
edition = "2021"
description = "rmpca — Route Optimization TUI & Agent Engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/spacialglaciercom-lab/v2rmp"
homepage = "https://github.com/spacialglaciercom-lab/v2rmp"
readme = "README.md"
keywords = ["vrp", "route-optimization", "tui", "agent", "osm"]
categories = ["command-line-utilities", "algorithms", "visualization"]
exclude = [
    "monaco.osm.pbf",
    "target/",
    ".bob/",
    "vector_clean.py",
    "*_patch.diff",
    "VECTOR_DB_CONFIG.md",
    "find_duplicates.py",
    "zilliz_embed_pipeline.py",
    "cloud-vectordb-examples/",
]

[[bin]]
name = "rmpca"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "rmpca-extract"
path = "src/bin/extract.rs"
required-features = ["extract"]

[[bin]]
name = "zilliz-mcp-server"
path = "src/bin/zilliz-mcp-server.rs"

[[bin]]
name = "rmpca-mcp-server"
path = "src/bin/rmpca-mcp-server.rs"
required-features = ["extract"]

[[bin]]
name = "web-ui"
path = "src/bin/web_ui.rs"
required-features = ["gui"]

[[bin]]
name = "generate-training-data"
path = "src/bin/generate-training-data.rs"
required-features = ["ml"]

[[bin]]
name = "evaluate-selector"
path = "src/bin/evaluate-selector.rs"
required-features = ["ml"]

[dependencies]
# TUI (feature-gated)
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
chrono = "0.4"
anyhow = "1"
async-trait = "0.1"

reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
osmpbf = { version = "0.3", optional = true }
clap = { version = "4.5", features = ["derive"] }
dirs = { version = "5.0", optional = true }
shellexpand = { version = "3.1", optional = true }
candle-core = { version = "0.10", optional = true }
candle-nn = { version = "0.10", optional = true }
candle-transformers = { version = "0.10", optional = true }
tokenizers = { version = "0.22", optional = true }
hf-hub = { version = "0.5", default-features = false, features = ["ureq"], optional = true }

# Extraction (object_store + parquet + geo)
object_store = { version = "0.11", features = ["aws"], optional = true }
parquet = { version = "54", features = ["async"], optional = true }
arrow = { version = "54", optional = true }
futures-util = "0.3"
geo-types = "0.7"
geo-traits = "0.2"
geo = "0.28"
geojson = "0.24"
wkb = "0.8"
tokio = { version = "1", default-features = false, features = ["sync", "macros", "rt-multi-thread"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "postgres", "chrono", "json"], optional = true }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
crc32fast = "1.4"
petgraph = "0.6"
rstar = "0.12"
ordered-float = "4.2"
gdal = { version = "0.18", features = ["bindgen"], optional = true }
regex = "1"

# Web UI (eframe/egui) — feature-gated
eframe = { version = "0.34.2", features = ["glow", "persistence"], optional = true }
egui = { version = "0.34.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
rfd = { version = "0.15", optional = true }

# WASM32 target dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
log = "0.4.29"
wasm-bindgen = "0.2.121"
web-sys = { version = "0.3.98", features = ["Document", "Element", "EventTarget", "HtmlCanvasElement", "HtmlElement", "Node", "Window"] }
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[features]
default = ["cli", "extract"]
cli = ["ratatui", "crossterm", "extract"]
gui = ["eframe", "egui", "rfd", "wasm-bindgen-futures"]
extract = ["object_store", "parquet", "arrow", "osmpbf", "gdal", "dirs", "shellexpand", "sqlx"]
ml = ["tokenizers", "candle-core", "candle-nn", "candle-transformers", "hf-hub"]
